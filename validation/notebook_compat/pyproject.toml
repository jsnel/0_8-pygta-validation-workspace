[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyglotaran-notebook-compat"
version = "0.1.0"
description = "Shared compatibility adapters for validated pyglotaran notebooks"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["pyglotaran_compat"]
